dataset:
  name: idrid
  image_size: 224
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  splits:
    train: B. Grading/2. Groundtruths/a. IDRiD_Disease Grading_Training Labels.csv

preprocessing:
  apply_circular_crop: true
  apply_clahe: true
  target_size: [512, 512]

quality_assessment:
  enable_quality_labels: true
  quality_label_csv: "experiments/quality/idrid_quality_labeled.csv"

augmentation:
  enable_medical_aug: true
  anatomical_shift_prob: 0.3
  simulated_exudates_prob: 0.2
  camera_artifacts_prob: 0.3

smartphone_simulation:
  enable: true
  motion_blur_prob: 0.3
  low_light_prob: 0.3
  jpeg_artifacts_prob: 0.3
  offcenter_crop_prob: 0.3
