training:
  optimizer: adamw
  learning_rate: 1e-4
  weight_decay: 0.05
  scheduler: cosine
  batch_size: 32
  epochs: 100
  criterion: cross_entropy
  num_workers: 4
  pin_memory: true
  quality_sampling:
    enable: false
    weights:
      Good: 1.0
      Fair: 1.5
      Poor: 2.5

fewshot:
  enabled: false
  n_way: 5
  k_shot: 5
  n_query: 15
  n_episodes: 100
  datasets: ["aptos2019", "messidor2"]
  mix_mode: "balanced"
